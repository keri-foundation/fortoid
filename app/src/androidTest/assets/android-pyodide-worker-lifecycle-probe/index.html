<!DOCTYPE html>
<meta charset="utf-8">
<title>Pyodide Vault Lifecycle Probe</title>
<script type="module">
// Report results through a pollable global. Every stage transition is preserved.
window.__vaultLifecycleResult = { state: "loading", stage: "probe_started" };

function setStage(s) { window.__vaultLifecycleResult.stage = s; }
function fail(category, message) {
    window.__vaultLifecycleResult = {
        state: "error", category, message,
        stage: window.__vaultLifecycleResult.stage
    };
}

// ── 1. Install test-only Worker tracker BEFORE any producer import ──────
(function installWorkerTracker() {
    const NativeWorker = globalThis.Worker;
    if (!NativeWorker) {
        fail("WORKER_TRACKER_INSTALL_FAILED", "globalThis.Worker unavailable");
        return;
    }
    window.__workerTracker = {
        constructCount: 0,
        terminateCount: 0,
        constructed: [],
        terminated: []
    };
    globalThis.Worker = class TrackedWorker extends NativeWorker {
        constructor(...args) {
            super(...args);
            this.__trackedId = ++window.__workerTracker.constructCount;
            window.__workerTracker.constructed.push(this.__trackedId);
        }
        terminate() {
            window.__workerTracker.terminateCount++;
            window.__workerTracker.terminated.push(this.__trackedId || 0);
            return super.terminate();
        }
    };
})();

// ── 2. Count native bridge diagnostics BEFORE importing producer modules ──
// Observation-only: forwards every message to the Android listener exactly once
// with the original receiver semantics, and fails clearly (nativeCounterInstalled
// remains false) if window.bridge.postMessage is unavailable or non-writable.
(function installNativeEventCounter() {
    window.__nativeEventCounts = null;
    try {
        const bridgeObj = window.bridge;
        if (!bridgeObj || typeof bridgeObj.postMessage !== "function") {
            return; // counts stay null → nativeCounterInstalled=false
        }
        const originalPostMessage = bridgeObj.postMessage;
        const orig = originalPostMessage.bind(bridgeObj);
        const counts = {
            boot: 0,
            ready: 0,
            preloadComplete: 0,
            preloadFailed: 0,
            terminalFailure: 0
        };
        const wrapper = function (payload) {
            try {
                const obj = typeof payload === "string" ? JSON.parse(payload) : payload;
                const msg = (obj && obj.message) || "";
                const type = (obj && obj.type) || "";
                if (type === "lifecycle" && msg.indexOf("state=boot") >= 0) counts.boot++;
                if (type === "lifecycle" && msg.indexOf("state=ready") >= 0) counts.ready++;
                if (msg.indexOf("worker_preload_complete") >= 0) counts.preloadComplete++;
                if (msg.indexOf("worker_preload_failed") >= 0) counts.preloadFailed++;
                if (msg.indexOf("terminal_failure") >= 0) counts.terminalFailure++;
            } catch (_) { /* ignore unparseable */ }
            return orig(payload);
        };
        bridgeObj.postMessage = wrapper;
        // Fail clearly if the assignment did not take (e.g. frozen bridge object).
        if (bridgeObj.postMessage !== wrapper) {
            window.__nativeEventCounts = null;
            return;
        }
        window.__nativeEventCounts = counts;
    } catch (_) {
        window.__nativeEventCounts = null;
    }
})();

function nativeCounts() {
    return window.__nativeEventCounts || {
        boot: 0, ready: 0, preloadComplete: 0, preloadFailed: 0, terminalFailure: 0
    };
}

function waitFor(condition, timeoutMs, code, label) {
    const start = Date.now();
    return new Promise((resolve, reject) => {
        (function poll() {
            if (condition()) { resolve(); return; }
            if (Date.now() - start > timeoutMs) {
                reject(Object.assign(new Error(label + " timed out"), { code }));
                return;
            }
            setTimeout(poll, 100);
        })();
    });
}

(async function run() {
try {
    setStage("importing_bridge");
    const bridgeModule = await import("/app/runtime/bridge.js");
    setStage("bridge_imported");
    if (!bridgeModule.createRuntimeBridge) {
        fail("BRIDGE_IMPORT_FAILED", "createRuntimeBridge not exported");
        return;
    }

    const originContract = window.__FORT_RUNTIME_ORIGIN__;
    if (!originContract || !originContract.documentOrigin || !originContract.workerUrl || !originContract.configUrl) {
        fail("ORIGIN_CONTRACT_MISSING", "__FORT_RUNTIME_ORIGIN__ incomplete");
        return;
    }
    setStage("origin_contract_validated");

    const alias = "android-lifecycle-" + (
        typeof crypto !== "undefined" && crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()) + "-" + String(Math.floor(Math.random() * 1e6))
    );

    // ── Phase 1: first bridge + worker ─────────────────────────────────
    setStage("bridge1_creating");
    const bridge1 = bridgeModule.createRuntimeBridge({
        workerUrl: originContract.workerUrl,
        configUrl: originContract.configUrl,
        runtimeOriginContract: originContract,
    });
    setStage("bridge1_created");
    const constructsAfterPhase1 = window.__workerTracker.constructCount;
    if (constructsAfterPhase1 < 1) {
        fail("FIRST_WORKER_BOOT_FAILED", "no Worker constructed after bridge1 creation");
        return;
    }

    setStage("vault_creating");
    const createResult = await bridge1.request("vaults.create", { name: alias });
    const vaultId = createResult && createResult.vault && createResult.vault.id;
    if (!vaultId) {
        fail("VAULT_CREATE_RESPONSE_INVALID", "vaults.create returned no vault id");
        return;
    }
    setStage("vault_created");
    const worker1Id = window.__workerTracker.constructed[window.__workerTracker.constructed.length - 1];
    const bootAfterPhase1 = nativeCounts().boot;
    const readyAfterPhase1 = nativeCounts().ready;
    const preloadAfterPhase1 = nativeCounts().preloadComplete;
    if (worker1Id === undefined || bootAfterPhase1 < 1 || readyAfterPhase1 < 1 || preloadAfterPhase1 < 1) {
        fail("FIRST_WORKER_BOOT_FAILED", "first worker boot/preload evidence incomplete");
        return;
    }

    setStage("vault_listing_phase1");
    const list1 = await bridge1.request("vaults.list", {});
    const found1 = (list1 && list1.vaults || []).some(v => v.id === vaultId);
    if (!found1) {
        fail("VAULT_NOT_FOUND_AFTER_CREATE", "created vault missing from vaults.list");
        return;
    }
    setStage("vault_confirmed_in_list");

    // ── Phase-2 baseline, captured BEFORE terminating the first worker ──
    const bootBeforeBridge2 = nativeCounts().boot;
    const readyBeforeBridge2 = nativeCounts().ready;
    const preloadBeforeBridge2 = nativeCounts().preloadComplete;

    // ── Terminate the first worker, observe underlying terminate ───────
    setStage("bridge1_destroying");
    const beforeTerminate = window.__workerTracker.terminateCount;
    bridge1.destroy();
    await waitFor(
        () => window.__workerTracker.terminateCount > beforeTerminate,
        20000,
        "WORKER_TERMINATION_NOT_OBSERVED",
        "worker termination"
    );
    const terminatesAfterPhase1 = window.__workerTracker.terminateCount;
    if (!window.__workerTracker.terminated.includes(worker1Id)) {
        fail("WORKER1_NOT_TERMINATED", "first worker id not present in terminated ids");
        return;
    }
    setStage("worker1_terminated");

    // ── Phase 2: genuinely new bridge + worker ─────────────────────────
    setStage("bridge2_creating");
    const bridge2 = bridgeModule.createRuntimeBridge({
        workerUrl: originContract.workerUrl,
        configUrl: originContract.configUrl,
        runtimeOriginContract: originContract,
    });
    setStage("bridge2_created");
    const constructsAfterPhase2 = window.__workerTracker.constructCount;
    if (constructsAfterPhase2 <= constructsAfterPhase1) {
        fail("SECOND_WORKER_NOT_DISTINCT", "no new Worker constructed after termination");
        return;
    }

    setStage("vault_listing_phase2");
    const list2 = await bridge2.request("vaults.list", {});
    const found2 = (list2 && list2.vaults || []).some(v => v.id === vaultId);
    if (!found2) {
        fail("VAULT_NOT_PERSISTED_AFTER_TERMINATION", "created vault missing from vaults.list after worker termination");
        return;
    }
    setStage("persisted_vault_found");

    const worker2Id = window.__workerTracker.constructed[window.__workerTracker.constructed.length - 1];
    const bootAfterBridge2 = nativeCounts().boot;
    const readyAfterBridge2 = nativeCounts().ready;
    const preloadAfterBridge2 = nativeCounts().preloadComplete;
    const worker2TerminatedBeforeCleanup = window.__workerTracker.terminated.includes(worker2Id);

    if (worker2Id === undefined || worker2Id <= worker1Id) {
        fail("SECOND_WORKER_NOT_DISTINCT", "second worker id not greater than first worker id");
        return;
    }
    if (worker2TerminatedBeforeCleanup) {
        fail("WORKER2_ALREADY_TERMINATED", "second worker id already present in terminated ids");
        return;
    }
    if (bootAfterBridge2 <= bootBeforeBridge2) {
        fail("PHASE2_BOOT_NOT_OBSERVED", "no new boot lifecycle event after phase-2 baseline");
        return;
    }
    if (readyAfterBridge2 <= readyBeforeBridge2) {
        fail("PHASE2_READY_NOT_OBSERVED", "no new ready lifecycle event after phase-2 baseline");
        return;
    }
    if (preloadAfterBridge2 <= preloadBeforeBridge2) {
        fail("PHASE2_PRELOAD_NOT_OBSERVED", "no new worker_preload_complete event after phase-2 baseline");
        return;
    }

    setStage("vault_reopening");
    const openResult = await bridge2.request("vaults.open", { vaultId });
    if (!openResult || !openResult.vault || openResult.vault.id !== vaultId) {
        fail("VAULT_REOPEN_IDENTITY_MISMATCH", "vaults.open returned a different or missing vault id");
        return;
    }
    setStage("vault_reopened");

    setStage("vault_summary_verifying");
    const summary = await bridge2.request("vaults.summary", { vaultId });
    if (!summary || !summary.vault || summary.vault.id !== vaultId) {
        fail("VAULT_SUMMARY_FAILED", "vaults.summary did not confirm the reopened vault");
        return;
    }
    setStage("vault_summary_verified");

    setStage("vault_closing");
    await bridge2.request("vaults.close", { vaultId });
    setStage("vault_closed");

    bridge2.destroy();

    window.__vaultLifecycleResult = {
        state: "done",
        stage: "done",
        vaultId,
        vaultAlias: alias,
        worker1Id,
        worker2Id,
        worker1Terminated: true,
        worker2Distinct: worker2Id > worker1Id,
        worker2Untainted: !worker2TerminatedBeforeCleanup,
        constructAfterPhase1: constructsAfterPhase1,
        terminateAfterPhase1: terminatesAfterPhase1,
        constructAfterPhase2: constructsAfterPhase2,
        nativeCounterInstalled: window.__nativeEventCounts !== null,
        bootBeforeBridge2,
        bootAfterBridge2,
        readyBeforeBridge2,
        readyAfterBridge2,
        preloadBeforeBridge2,
        preloadAfterBridge2,
        phase2VaultFound: found2,
        reopenedVaultId: openResult.vault.id,
        summaryVerified: summary.vault.id === vaultId,
        origin: location.origin,
        isSecureContext: window.isSecureContext || false,
    };
} catch (e) {
    fail(e && e.code ? e.code : "PROBE_ERROR", e && e.message ? e.message : String(e));
}
})();

// Safety timeout: fail if probe never reaches terminal state.
setTimeout(() => {
    if (window.__vaultLifecycleResult.state === "loading") {
        fail("PROBE_TIMEOUT", "probe did not reach terminal state");
    }
}, 300000);
</script>
